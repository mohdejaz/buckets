<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Change Password — Buckets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <style>
    body { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4f46e5 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; padding: 1.5rem 1rem; }
    .auth-card { background: #fff; border-radius: 16px; box-shadow: 0 25px 60px rgba(0,0,0,.35); width: 100%; max-width: 420px; overflow: hidden; }
    .auth-header { background: linear-gradient(135deg, #1e1b4b, #4f46e5); padding: 2rem; text-align: center; }
    .auth-brand-icon { width: 56px; height: 56px; background: rgba(255,255,255,.15); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; color: #fff; margin-bottom: .75rem; }
    .auth-brand-name { font-size: 1.4rem; font-weight: 700; color: #fff; display: block; }
    .auth-brand-sub  { font-size: .8rem; color: rgba(255,255,255,.65); display: block; margin-top: .15rem; }
    .auth-body { padding: 2rem; }
    .auth-title { font-size: 1.05rem; font-weight: 700; color: #1e293b; margin-bottom: .5rem; }
    .auth-intro { font-size: .83rem; color: #64748b; margin-bottom: 1.5rem; }
    .form-label { font-size: .82rem; font-weight: 600; color: #475569; }
    .form-control { font-size: .88rem; border-color: #cbd5e1; border-radius: 8px; padding: .6rem .85rem; }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .input-group-text { background: #f8fafc; border-color: #cbd5e1; color: #64748b; }
    .btn-signin { background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none; color: #fff; font-weight: 600; font-size: .9rem; padding: .65rem; border-radius: 8px; width: 100%; transition: opacity .15s; }
    .btn-signin:hover { opacity: .9; color: #fff; }
    .btn-signin:disabled { opacity: .55; }
    .auth-footer { text-align: center; padding: 1rem 2rem 1.5rem; font-size: .83rem; color: #64748b; }
    .auth-footer a { color: #4f46e5; font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .alert { font-size: .83rem; border-radius: 8px; }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-brand-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <span class="auth-brand-name">Buckets</span>
    <span class="auth-brand-sub">Personal Budget Manager</span>
  </div>

  <div class="auth-body">
    <div class="auth-title"><i class="bi bi-key me-2 text-primary"></i>Change Your Password</div>
    <p class="auth-intro">
      {% if forced %}
        Welcome{{ ', ' + user_name if user_name else '' }}. For security you must set a new
        password before continuing.
      {% else %}
        Set a new password for your account.
      {% endif %}
    </p>

    <div class="alert alert-danger d-none" id="cpAlert" role="alert"></div>

    <form id="cpForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="cpCurrent">Current Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="cpCurrent"
                 autocomplete="current-password" placeholder="Your temporary password" required/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="cpNew">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="cpNew"
                 autocomplete="new-password" placeholder="At least 10 characters"
                 minlength="10" required oninput="cpCheck()"/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="cpConfirm">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control" id="cpConfirm"
                 autocomplete="new-password" placeholder="Repeat new password"
                 required oninput="cpCheck()"/>
        </div>
        <div class="form-text text-danger d-none" id="cpMismatch">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn btn-signin" id="cpSubmit">
        <i class="bi bi-check-circle me-2"></i>Update Password
      </button>
    </form>
  </div>

  <div class="auth-footer">
    <a href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Sign out</a>
  </div>
</div>

<script>
  const form     = document.getElementById('cpForm');
  const cur      = document.getElementById('cpCurrent');
  const npw      = document.getElementById('cpNew');
  const conf     = document.getElementById('cpConfirm');
  const mismatch = document.getElementById('cpMismatch');
  const alertBox = document.getElementById('cpAlert');
  const submit   = document.getElementById('cpSubmit');

  function cpCheck() {
    const bad = conf.value && npw.value !== conf.value;
    mismatch.classList.toggle('d-none', !bad);
    return !bad;
  }

  function showError(msg) {
    alertBox.textContent = msg;
    alertBox.classList.remove('d-none');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('d-none');
    if (npw.value.length < 10) { showError('New password must be at least 10 characters.'); return; }
    if (!cpCheck()) { showError('New passwords do not match.'); return; }

    submit.disabled = true;
    try {
      const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          current_password: cur.value,
          new_password: npw.value,
          confirm_password: conf.value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        window.location.href = '/';
      } else {
        showError(data.error || 'Could not update password.');
        submit.disabled = false;
      }
    } catch (err) {
      showError('Network error. Please try again.');
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
